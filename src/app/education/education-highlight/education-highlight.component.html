<div class="relative flex flex-col items-center">
    <div class="h-6 w-6 rounded-full bg-primary-400"></div>

    <div class="w-0.5 h-24 md:h-10 bg-primary-400/60 absolute left-1/2 -translate-x-1/2" [class]="stemClasses"></div>

    <div class="absolute left-1/2 -translate-x-1/2 z-10" [class]="tooltipClasses">
        <div class="bg-card rounded-xl px-3 py-3 shadow-xl shadow-black/40 min-w-48 md:min-w-60 text-center backdrop-blur-sm">
            <div class="text-page-foreground/60 text-sm font-semibold uppercase tracking-widest mb-1">
                <ng-content select="[slot=label]"></ng-content>
            </div>
            <div class="text-page-foreground font-medium leading-snug text-base md:text-lg font-barlow">
                <ng-content select="[slot=title]"></ng-content>
            </div>
            <div class="text-page-foreground/60 text-sm mt-1 leading-relaxed">
                <ng-content select="[slot=description]"></ng-content>
            </div>
        </div>
    </div>
</div>
